<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 技能交换平台</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js" defer></script><script src="/js/login.js" defer></script>
</head>
<body>
  <header class="site-header"><nav class="container nav"><a class="brand" href="/"><span class="brand-mark">EX</span><span>技能交换</span></a><div class="nav-links"><a href="/">返回首页</a><a href="/register.html">注册账号</a></div></nav></header>
  <main class="auth-layout">
    <section class="panel auth-card">
      <p class="eyebrow">WELCOME BACK</p><h1>登录平台</h1><p>使用账号继续管理技能和交换申请。</p>
      <form id="loginForm" class="stack">
        <div class="field"><label for="username">用户名</label><input class="input" id="username" name="username" required autocomplete="username" value="linxia"></div>
        <div class="field"><label for="password">密码</label><input class="input" id="password" name="password" type="password" required autocomplete="current-password" value="123456"></div>
        <p class="form-note">演示账号：linxia / 123456</p>
        <div id="formMessage" class="message" hidden></div>
        <button class="btn btn-block" type="submit">登录</button>
      </form>
    </section>
  </main>
  <footer class="site-footer">课程项目演示 · 24002120509 杨庆鸿</footer>
</body>
</html>
