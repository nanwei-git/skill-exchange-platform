<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="个人技能交换平台，用技能连接校园伙伴。">
  <title>技能交换平台</title>
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/app.js" defer></script>
  <script src="/js/index.js" defer></script>
</head>
<body>
  <header class="site-header">
    <nav class="container nav">
      <a class="brand" href="/"><span class="brand-mark">EX</span><span>技能交换</span></a>
      <div class="nav-links">
        <a href="#skills">发现技能</a>
        <a data-auth-only hidden href="/skill-form.html">发布技能</a>
        <a data-auth-only hidden href="/dashboard.html">个人中心</a>
        <a data-guest-only href="/login.html">登录</a>
        <a data-guest-only class="btn btn-small" href="/register.html">加入平台</a>
        <button data-auth-only hidden data-logout>退出</button>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <p class="eyebrow">LEARN · SHARE · CONNECT</p>
        <h1>把你会的，换成你想学的。</h1>
        <p class="hero-copy">发布技能、寻找伙伴、发起交换。在校园里用真实经验连接彼此，让每个人既是学习者，也是分享者。</p>
        <div class="hero-actions">
          <a class="btn" href="#skills">浏览技能</a>
          <a class="btn btn-secondary" href="/skill-form.html">发布我的技能</a>
        </div>
        <div class="hero-stats" aria-label="项目统计">
          <div class="hero-stat"><strong>7</strong><span>张关联数据表</span></div>
          <div class="hero-stat"><strong>29</strong><span>个 REST API</span></div>
          <div class="hero-stat"><strong>100%</strong><span>完整交换闭环</span></div>
        </div>
      </div>
    </section>

    <section id="skills" class="container section">
      <div class="section-head">
        <div><p class="eyebrow">SKILL MARKET</p><h2>发现值得交换的技能</h2><p>支持关键词、分类、类型、地点和热度筛选。</p></div>
      </div>
      <form id="filterForm" class="filter-bar">
        <div class="field"><label for="keyword">关键词</label><input class="input" id="keyword" name="keyword" placeholder="搜索技能或发布者"></div>
        <div class="field"><label for="categoryId">分类</label><select class="select" id="categoryId" name="categoryId"><option value="">全部分类</option></select></div>
        <div class="field"><label for="type">类型</label><select class="select" id="type" name="type"><option value="">全部类型</option><option value="offer">我掌握</option><option value="request">我想学</option></select></div>
        <div class="field"><label for="locationType">方式</label><select class="select" id="locationType" name="locationType"><option value="">全部方式</option><option value="online">线上</option><option value="offline">线下</option><option value="both">均可</option></select></div>
        <div class="field"><label for="sort">排序</label><select class="select" id="sort" name="sort"><option value="newest">最新发布</option><option value="popular">浏览最多</option><option value="favorites">收藏最多</option></select></div>
        <div class="field"><label>&nbsp;</label><button class="btn" type="submit">筛选</button></div>
      </form>
      <div id="skillMessage" class="message" hidden></div>
      <div id="skillGrid" class="card-grid"><div class="loading">正在加载技能…</div></div>
      <div id="pagination" class="pagination"></div>
    </section>
  </main>

  <footer class="site-footer">课程项目演示 · 24002120509 杨庆鸿 · 个人技能交换平台</footer>
</body>
</html>
